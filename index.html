<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmithX Marketplace</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <div class="logo">SMITH<span>X</span></div>

    <button class="cart-btn" onclick="openCart()">
      🛒 Cart
      <span id="cartCount">0</span>
    </button>
  </header>


  <section class="hero">
    <small>SMITHX MARKETPLACE</small>

    <h1>
      Discover Products
    </h1>

    <p>
      Shop products from the SmithX marketplace.
    </p>
  </section>


  <main>

    <div
      id="products"
      class="products"
    ></div>

  </main>


  <!-- CART -->

  <div
    id="cartOverlay"
    class="overlay"
    onclick="closeCart()"
  ></div>

  <aside
    id="cart"
    class="cart"
  >

    <div class="cart-header">

      <h2>
        Shopping Cart
      </h2>

      <button
        onclick="closeCart()"
        class="close"
      >
        ×
      </button>

    </div>


    <div
      id="cartItems"
      class="cart-items"
    ></div>


    <div class="cart-bottom">

      <div class="total">
        <span>Total</span>

        <strong>
          KES <span id="cartTotal">0</span>
        </strong>
      </div>

      <button
        class="checkout"
        onclick="checkout()"
      >
        Checkout
      </button>

    </div>

  </aside>


  <div
    id="message"
    class="message"
  ></div>


  <script src="app.js"></script>

</body>
</html>
