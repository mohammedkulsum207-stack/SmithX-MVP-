<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="SM1THX Marketplace — shop products from stores across the platform."
  >

  <title>SM1THX Marketplace — Shop Products</title>

  <link
    rel="stylesheet"
    href="styles.css?v=20261014-3"
  >

  <link rel="stylesheet" href="phase1.css?v=20261014-2"> <!-- Phase 1 add-on: delete this line to remove -->
  <link rel="stylesheet" href="phase2.css?v=20261014-2"> <!-- Phase 2 add-on: delete this line to remove -->
  <link rel="stylesheet" href="marketplace-redesign.css?v=1">
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="topbar">

  <div class="topbar-inner">

    <a
      href="#market"
      class="smithx-brand"
      aria-label="SM1THX Home"
    >

      <img
        src="assets/smithx-logo.jpg"
        class="smithx-logo-image"
        alt="SM1THX logo"
      >

      <span class="smithx-brand-text">

        <strong>
          SM1THX 🛒
        </strong>

        <small>
          SHOP • BUY • GROW
        </small>

      </span>

    </a>


    <nav
      class="nav-links"
      aria-label="Main navigation"
    >

      <a href="#market">
        Home
      </a>

      <a href="#market">Marketplace</a>
<!-- NEW CUSTOMER ORDER PAGE -->

      <a href="my-orders.html">
        My Orders
      </a>
      <a href="profile.html" aria-label="Open your profile">
        Profile
      </a>
</nav>


    <button
      type="button"
      class="nav-login-btn"
      id="loginNavButton"
      onclick="openLogin()"
    >
      Login
    </button>


    <button
      type="button"
      class="cart-button"
      onclick="openCart()"
      aria-label="Open shopping cart"
    >

      🛒

      <span
        id="cartCount"
        class="cart-count"
      >
        0
      </span>

    </button>

  </div>

</header>


<main>



<!-- =====================================================
     MARKETPLACE
===================================================== -->

<section
  id="market"
  class="section marketplace-section"
>

  <div class="section-inner">

    <div class="marketplace-tools">

      <div class="search-box">

        <input
          id="productSearch"
          type="search"
          placeholder="Search products..."
          aria-label="Search products"
        >

      </div>


    </div>


    <div
      id="categoryFilters"
      class="category-filters"
      aria-label="Product categories"
    ></div>


    <div
      id="productsGrid"
      class="products-grid"
    ></div>

  </div>

</section>



</main>


<!-- =====================================================
     PRODUCT MODAL
===================================================== -->

<div
  id="productModal"
  class="modal"
  aria-hidden="true"
>

  <div class="modal-content">

    <button
      type="button"
      class="modal-close"
      onclick="closeProductModal()"
      aria-label="Close product"
    >
      ×
    </button>

    <div
      id="productModalContent"
    ></div>

  </div>

</div>


<!-- =====================================================
     CART
===================================================== -->

<aside
  id="cartPanel"
  class="cart-panel"
  aria-hidden="true"
>

  <div class="cart-header">

    <div>

      <p class="section-eyebrow">
        SM1THX 🛒
      </p>

      <h2>
        Your Cart
      </h2>

    </div>


    <button
      type="button"
      class="cart-close"
      onclick="closeCart()"
      aria-label="Close cart"
    >
      ×
    </button>

  </div>


  <div
    id="cartItems"
    class="cart-items"
  ></div>


  <div class="cart-total">

    <span>
      Subtotal
    </span>

    <strong id="cartSubtotal">
      KES 0
    </strong>

  </div>


  <div class="cart-total">

    <span>
      Total
    </span>

    <strong id="cartTotal">
      KES 0
    </strong>

  </div>


  <div class="cart-actions">

    <button
      type="button"
      class="secondary-button full-width"
      onclick="clearShoppingCart()"
    >
      Clear Cart
    </button>


    <button
      type="button"
      class="primary-button full-width"
      onclick="demoCheckout()"
    >
      Demo Checkout
    </button>

  </div>

</aside>


<!-- =====================================================
     TOAST
===================================================== -->

<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite"
></div>
<!-- =====================================================
     APPLICATION JAVASCRIPT
===================================================== -->

<script src="app.js?v=20261014-2"></script>
<script src="auth-nav.js"></script> <!-- Login/Profile add-on: delete this line to remove -->
<script src="stores.js?v=20261014-2"></script> <!-- Phase 1 add-on: delete these two lines to remove -->
<script src="phase1.js?v=20261014-4"></script>
<script src="wallet.js"></script> <!-- Phase 3 SMX Credit: delete this line to remove -->
<script src="checkout-config.js"></script> <!-- Phase 2 add-on: delete these two lines to remove -->
<script src="phase2.js"></script>
<script src="reviews.js"></script> <!-- Phase 4 add-ons: delete these two lines to remove -->
<script src="phase4-ai.js"></script>
<script src="intl-config.js"></script> <!-- Phase 5 international: delete these two lines to remove -->
<script src="intl.js"></script>

<link rel="stylesheet" href="comfort.css"> <!-- Comfort add-on: delete these two lines to remove -->
<link rel="stylesheet" href="inventory.css">
<script src="comfort.js"></script>
<script src="inventory.js"></script>
</body>
</html>
