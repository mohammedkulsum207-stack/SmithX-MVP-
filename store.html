<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A seller storefront on SM1THX.">
  <title>Store — SM1THX</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap");
    @import url("https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap");

    :root {
      --ink: #16130f;
      --ivory: #f6f1e8;
      --paper: #fffdf9;
      --line: #e8e0d2;
      --muted: #6f675a;
      --gold-bright: #e8a33d;
      --gold-text: #8a5f14;
      --accent: #e8a33d;
      --accent-ink: #16130f;
      --font-display: "Cormorant Garamond", Georgia, serif;
      --font-body: "Switzer", "Inter", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--ivory);
      color: var(--ink);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }
    button { font: inherit; }
    :focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }

    header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 max(20px, calc((100% - 1180px) / 2));
      background: rgba(14, 12, 9, .92);
      border-bottom: 1px solid rgba(232, 163, 61, .14);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: .14em;
    }

    .brand img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, .25);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: .9rem;
      text-decoration: none;
      white-space: nowrap;
    }

    .back-btn:hover { border-color: var(--gold-bright); color: var(--gold-bright); }

    .banner {
      position: relative;
      overflow: hidden;
      color: #fff;
      background: var(--accent-ink);
      padding: 64px max(20px, calc((100% - 1180px) / 2)) 56px;
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--accent) 55%, transparent) 0%, transparent 55%),
        radial-gradient(90% 120% at 0% 100%, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 60%);
      z-index: 0;
    }

    .banner > * { position: relative; z-index: 1; }

    .store-head {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    .store-logo {
      width: 92px;
      height: 92px;
      flex: 0 0 92px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: var(--accent);
      color: var(--accent-ink);
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 700;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
    }

    .eyebrow {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .store-head h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 600;
      line-height: 1.05;
      margin-top: 4px;
    }

    .tagline { margin-top: 6px; font-size: 1.05rem; color: rgba(255, 255, 255, .78); }

    .store-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
      align-items: center;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .16);
      font-size: .84rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 12px;
      border: 0;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-accent { background: var(--accent); color: var(--accent-ink); }
    .btn-accent:hover { filter: brightness(1.06); }
    .btn-ghost { background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, .3); }

    .page { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 44px 0 72px; }

    .about {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px 26px;
      margin-bottom: 36px;
      color: #3d372e;
      white-space: pre-line;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .section-title h2 { font-family: var(--font-display); font-size: 2rem; font-weight: 600; }
    .section-title span { color: var(--muted); font-size: .9rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border: 1px solid rgba(22, 19, 15, .08);
      border-radius: 20px;
      overflow: hidden;
      text-decoration: none;
      transition: transform .3s ease, box-shadow .3s ease;
    }

    .card:hover { transform: translateY(-4px); box-shadow: 0 22px 44px -18px rgba(22, 19, 15, .35); }

    .grid.layout-showcase { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 26px; }
    .grid.layout-showcase .card img { aspect-ratio: 1 / 1; }
    .grid.layout-showcase .card-body strong { font-size: 1.7rem; }
    .grid.layout-compact { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .grid.layout-compact .card img { aspect-ratio: 1 / 1; }
    .grid.layout-compact .card-body { padding: 12px 14px 14px; }
    .grid.layout-compact .card-body strong { font-size: 1.15rem; }
    .store-rating { display: inline-flex; align-items: center; gap: 8px; }

    .card img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: #1c1a17; }

    .card-body { padding: 18px 18px 20px; display: grid; gap: 6px; }
    .card-body small { color: var(--gold-text); font-size: .68rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
    .card-body strong { font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; line-height: 1.15; }
    .card-body span { font-weight: 600; font-variant-numeric: tabular-nums; }
    .card-body em { font-style: normal; color: var(--muted); font-size: .85rem; }

    .empty {
      padding: 48px 24px;
      text-align: center;
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 20px;
      color: var(--muted);
    }

    .empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 1.6rem; margin-bottom: 6px; }
    .empty .btn { margin-top: 18px; background: var(--ink); color: #fff; }

    .demo-note { margin-top: 36px; font-size: .82rem; color: var(--muted); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: .9rem;
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
      .brand span { display: none; }
      .back-btn { padding: 9px 14px; font-size: .82rem; }
      .banner { padding: 44px 16px 40px; }
      .store-logo { width: 72px; height: 72px; flex-basis: 72px; font-size: 1.9rem; border-radius: 18px; }
      .page { width: calc(100% - 28px); }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .card-body { padding: 12px; }
      .card-body strong { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<header>
  <a class="brand" href="index.html#home" aria-label="SM1THX home">
    <img src="assets/smithx-logo.jpg" alt="">
    <span>SM1THX</span>
  </a>
  <a class="back-btn" href="index.html#market">← Marketplace</a>
</header>

<main id="storeRoot">
  <section class="banner">
    <p class="eyebrow">Loading store…</p>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="auth.js"></script>
<script src="stores.js"></script>
<script src="wallet.js"></script> <!-- Phase 3/4 add-ons: delete these two lines to remove -->
<script src="reviews.js"></script>
<script src="intl-config.js"></script> <!-- Phase 5 international: delete these two lines to remove -->
<script src="intl.js"></script>
<script>
  (function () {
    const root = document.getElementById("storeRoot");
    const slug = new URLSearchParams(location.search).get("s") || "";
    const store = smxStoreBySlug(slug);
    const viewer = smxSessionEmail();
    const isOwner = store && viewer && store.ownerEmail === viewer;

    function toast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove("show"), 2400);
    }

    function notFound(title, body) {
      document.title = "Store not found — SM1THX";
      root.innerHTML = `
        <div class="page">
          <div class="empty">
            <strong>${title}</strong>
            ${body}
            <br><a class="btn" href="index.html#market">Browse the marketplace</a>
          </div>
        </div>`;
    }

    if (!store) {
      notFound("We couldn't find that store.",
        "Check the link, or ask the seller to share it again. During the MVP, store links only open in the browser where the store was created.");
      return;
    }

    if (!store.published && !isOwner) {
      notFound("This store isn't open yet.", "The seller hasn't published it. Check back soon.");
      return;
    }

    const theme = SMX_STORE_THEMES[store.theme] || SMX_STORE_THEMES.gold;
    document.documentElement.style.setProperty("--accent", theme.accent);
    document.documentElement.style.setProperty("--accent-ink", theme.ink);
    document.title = store.name + " — SM1THX";

    const products = smxStoreProducts(store);
    const since = smxFormatDate(store.createdAt);

    root.innerHTML = `
      <section class="banner">
        <div class="store-head">
          <div class="store-logo" aria-hidden="true">${smxEscape(smxInitials(store.name))}</div>
          <div>
            <p class="eyebrow">SM1THX store${store.published ? "" : " · Preview — not published"}</p>
            <h1>${smxEscape(store.name)}</h1>
            ${store.tagline ? `<p class="tagline">${smxEscape(store.tagline)}</p>` : ""}
          </div>
        </div>
        <div class="store-meta">
          <span class="chip">${products.length} ${products.length === 1 ? "product" : "products"}</span>
          ${(() => { const r = typeof smxRatingSummary === "function" ? smxRatingSummary(products.map(p => p.id)) : { count: 0 }; return r.count ? `<span class="chip store-rating">${smxStarsHTML(r.average)} ${r.average.toFixed(1)} · ${r.count} ${r.count === 1 ? "review" : "reviews"}</span>` : `<span class="chip">No reviews yet</span>`; })()}
          <span class="chip">On SM1THX since ${smxEscape(since)}</span>
          <button class="btn btn-accent" type="button" id="shareStore">Share store</button>
          ${isOwner ? `<a class="btn btn-ghost" href="profile.html#store">Edit store</a>` : ""}
        </div>
      </section>

      <div class="page">
        ${store.description ? `<div class="about">${smxEscape(store.description)}</div>` : ""}

        <div class="section-title">
          <h2>Products</h2>
          <span>Tap a product to view and buy</span>
        </div>

        ${products.length ? `
          <div class="grid layout-${smxEscape(store.layout || "grid")}">
            ${products.map(product => `
              <a class="card" href="index.html?product=${encodeURIComponent(product.id)}#market">
                <img src="${smxEscape(product.image || "")}" alt="${smxEscape(product.name)}" loading="lazy">
                <div class="card-body">
                  <small>${smxEscape(product.category || "Product")}</small>
                  <strong>${smxEscape(product.name)}</strong>
                  ${(() => { const r = typeof smxRatingSummary === "function" ? smxRatingSummary(product.id) : { count: 0 }; return r.count ? `<em class="store-rating">${smxStarsHTML(r.average)} ${r.average.toFixed(1)} (${r.count})</em>` : ""; })()}
                  <span>${smxFormatKES(product.price)}</span>
                  <em>View &amp; buy →</em>
                </div>
              </a>`).join("")}
          </div>` : `
          <div class="empty">
            <strong>No products yet.</strong>
            ${isOwner ? "Publish products in Seller Studio while signed in and they'll appear here." : "This seller is still stocking their shelves."}
            ${isOwner ? `<br><a class="btn" href="index.html#seller">Add a product</a>` : ""}
          </div>`}

        <p class="demo-note">MVP demo: stores and products are saved in this browser only. Sharing with other people will work once SM1THX has a backend.</p>
      </div>`;

    document.getElementById("shareStore").addEventListener("click", async () => {
      const result = await smxShareLink(smxStoreURL(store.slug), store.name + " on SM1THX");
      if (result === "copied") toast("Store link copied.");
    });
  })();
</script>
<script src="auth-nav.js"></script> <!-- Login/Profile add-on: delete this line to remove -->
<link rel="stylesheet" href="comfort.css"> <!-- Comfort add-on: delete these two lines to remove -->
<script src="comfort.js"></script>
</body>
</html>
