name: Seller analytics syntax checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/seller-analytics-profit-dashboard", "refactor/**"]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for file in *.js smoke-check.cjs; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Check local references, duplicate stylesheets, and inline scripts
        run: node smoke-check.cjs
