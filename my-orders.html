<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SM1THX — My Orders</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f9ff;
      color: #10233f;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 68px;
      background: #ffffff;
      border-bottom: 1px solid #e5edf7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #1264d8;
    }

    .logo span {
      color: #111827;
    }

    .back-btn {
      border: 0;
      background: #eef5ff;
      color: #1264d8;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .back-btn:hover {
      background: #dceaff;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      padding: 42px 24px 28px;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, #f5f9ff 100%);
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #667085;
      font-size: 16px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-wrap {
      max-width: 720px;
      margin: 0 auto 30px;
      padding: 0 20px;
    }

    .search {
      width: 100%;
      height: 48px;
      border: 1px solid #d5dfec;
      border-radius: 14px;
      padding: 0 16px;
      outline: none;
      background: white;
    }

    .search:focus {
      border-color: #1264d8;
      box-shadow: 0 0 0 3px rgba(18, 100, 216, 0.10);
    }

    /* =========================
       LAYOUT
    ========================= */

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 50px;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 22px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e4ebf4;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(25, 65, 110, 0.06);
    }

    /* =========================
       ORDER LIST
    ========================= */

    .orders-panel {
      padding: 18px;
      min-height: 500px;
    }

    .panel-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .order-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .order-item {
      width: 100%;
      text-align: left;
      border: 1px solid #e2eaf4;
      background: #ffffff;
      padding: 14px;
      border-radius: 13px;
      cursor: pointer;
      transition: 0.2s;
    }

    .order-item:hover {
      border-color: #9fc2f2;
      transform: translateY(-1px);
    }

    .order-item.active {
      border-color: #1264d8;
      background: #f2f7ff;
    }

    .order-id {
      font-weight: 800;
      color: #1264d8;
      margin-bottom: 7px;
    }

    .order-meta {
      font-size: 13px;
      color: #667085;
      margin-bottom: 8px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: #eef2f7;
      color: #475467;
    }

    .status-confirmed {
      background: #eaf4ff;
      color: #1264d8;
    }

    .status-shipped {
      background: #edf8ff;
      color: #0877b8;
    }

    .status-delivered {
      background: #eaf9ef;
      color: #16803c;
    }

    /* =========================
       DETAILS
    ========================= */

    .details-panel {
      padding: 24px;
      min-height: 500px;
    }

    .empty {
      min-height: 430px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #667085;
    }

    .empty-icon {
      font-size: 50px;
      margin-bottom: 12px;
    }

    .details-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 25px;
    }

    .details-header h2 {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .details-header p {
      color: #667085;
      font-size: 14px;
    }

    .demo-label {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff4d6;
      color: #8a6200;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* =========================
       TRACKING
    ========================= */

    .tracking-card {
      border: 1px solid #e3ebf5;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .tracking-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .tracking-title {
      font-size: 17px;
      font-weight: 800;
    }

    .tracking-location {
      color: #667085;
      font-size: 13px;
      margin-top: 4px;
    }

    .progress {
      position: relative;
      height: 7px;
      background: #e6edf6;
      border-radius: 20px;
      margin: 28px 5px 35px;
    }

    .progress-fill {
      position: absolute;
      height: 100%;
      width: 0%;
      background: #1264d8;
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    .progress-points {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
    }

    .point {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #d9e3ef;
      border: 3px solid white;
      box-shadow: 0 0 0 1px #d9e3ef;
      transition: 0.3s;
    }

    .point.active {
      background: #1264d8;
      box-shadow: 0 0 0 1px #1264d8;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .timeline-item {
      display: flex;
      gap: 12px;
    }

    .timeline-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #d5deea;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .timeline-item.active .timeline-dot {
      background: #1264d8;
    }

    .timeline-label {
      font-weight: 700;
      font-size: 14px;
    }

    .timeline-description {
      font-size: 13px;
      color: #667085;
      margin-top: 3px;
    }

    /* =========================
       ORDER ITEMS
    ========================= */

    .section-title {
      font-size: 17px;
      font-weight: 800;
      margin: 22px 0 12px;
    }

    .product-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid #edf1f6;
    }

    .product-info strong {
      display: block;
      margin-bottom: 4px;
    }

    .product-info span {
      font-size: 13px;
      color: #667085;
    }

    .product-price {
      font-weight: 800;
      white-space: nowrap;
    }

    .total {
      display: flex;
      justify-content: space-between;
      padding-top: 17px;
      font-size: 18px;
      font-weight: 900;
    }

    /* =========================
       DELIVERY INFO
    ========================= */

    .delivery-box {
      background: #f5f9ff;
      border-radius: 14px;
      padding: 15px;
      margin-top: 20px;
    }

    .delivery-box strong {
      display: block;
      margin-bottom: 5px;
    }

    .delivery-box span {
      color: #667085;
      font-size: 14px;
    }

    /* =========================
       BUTTONS
    ========================= */

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 800;
    }

    .btn-primary {
      background: #1264d8;
      color: white;
    }

    .btn-secondary {
      background: #edf4ff;
      color: #1264d8;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10233f;
      color: white;
      padding: 13px 18px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
      opacity: 0;
      transition: 0.3s;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {
      header {
        height: 62px;
        padding: 0 16px;
      }

      .logo {
        font-size: 22px;
      }

      .hero {
        padding: 30px 18px 22px;
      }

      .hero h1 {
        font-size: 29px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .orders-panel {
        min-height: auto;
      }

      .details-panel {
        min-height: auto;
      }

      .details-header {
        flex-direction: column;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      SM1<span>TH</span>X
    </div>

    <button class="back-btn" onclick="goBackToStore()">
      ← Marketplace
    </button>
  </header>

  <section class="hero">
    <h1>My Orders</h1>
    <p>Track your SM1THX orders from checkout to delivery.</p>
  </section>

  <div class="search-wrap">
    <input
      id="orderSearch"
      class="search"
      type="search"
      placeholder="Search order ID..."
      autocomplete="off"
    >
  </div>

  <main class="page">

    <div class="layout">

      <!-- ORDER LIST -->
      <section class="card orders-panel">

        <div class="panel-title">
          Your Orders
        </div>

        <div id="orderList" class="order-list"></div>

      </section>

      <!-- ORDER DETAILS -->
      <section class="card details-panel">

        <div id="details"></div>

      </section>

    </div>

  </main>

  <div id="toast" class="toast"></div>

  <script>
    "use strict";

    /* =====================================================
       STORAGE
    ===================================================== */

    const ORDERS_KEY = "smithx_orders_v2";
    const SELECTED_ORDER_KEY = "smithx_selected_order";
    const DEMO_KEY_PREFIX = "smithx_tracking_demo_";

    const DEMO_DURATION = 120000;

    let orders = [];
    let selectedOrderId = null;
    let searchText = "";
    let demoTimer = null;

    /* =====================================================
       TRACKING STAGES
    ===================================================== */

    const TRACKING_STEPS = [
      {
        key: "placed",
        label: "Order placed",
        description: "Your order has been received."
      },
      {
        key: "confirmed",
        label: "Order confirmed",
        description: "The seller has confirmed your order."
      },
      {
        key: "packed",
        label: "Order packed",
        description: "Your order has been prepared for shipment."
      },
      {
        key: "shipped",
        label: "Shipped",
        description: "Your package is on its way."
      },
      {
        key: "out_for_delivery",
        label: "Out for delivery",
        description: "Your package is approaching its destination."
      },
      {
        key: "delivered",
        label: "Delivered",
        description: "Your order has been delivered."
      }
    ];

    /* =====================================================
       BASIC HELPERS
    ===================================================== */

    function formatKES(amount) {
      return "KES " + Number(amount || 0).toLocaleString("en-KE");
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
      if (!value) return "Unknown date";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "Unknown date";
      }

      return date.toLocaleString("en-KE", {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }

    function showToast(message) {
      const toast = document.getElementById("toast");

      if (!toast) return;

      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2800);
    }

    /* =====================================================
       STORAGE HELPERS
    ===================================================== */

    function getOrders() {
      try {
        const raw = localStorage.getItem(ORDERS_KEY);

        if (!raw) {
          return [];
        }

        const parsed = JSON.parse(raw);

        return Array.isArray(parsed)
          ? parsed
          : [];
      } catch (error) {
        console.error("Could not read orders:", error);
        return [];
      }
    }

    function saveOrders() {
      try {
        localStorage.setItem(
          ORDERS_KEY,
          JSON.stringify(orders)
        );
      } catch (error) {
        console.error("Could not save orders:", error);
      }
    }

    function getSelectedOrderId() {
      try {
        const params = new URLSearchParams(
          window.location.search
        );

        const urlOrder = params.get("order");

        if (urlOrder) {
          return urlOrder;
        }

        return localStorage.getItem(
          SELECTED_ORDER_KEY
        );
      } catch (error) {
        return null;
      }
    }

    /* =====================================================
       ORDER STATUS
    ===================================================== */

    function normalizeStatus(status) {
      const value = String(status || "")
        .trim()
        .toLowerCase();

      if (value === "confirmed") return "Confirmed";
      if (value === "shipped") return "Shipped";
      if (value === "delivered") return "Delivered";

      return "Pending";
    }

    function statusClass(status) {
      const normalized = normalizeStatus(status);

      if (normalized === "Confirmed") {
        return "status-confirmed";
      }

      if (normalized === "Shipped") {
        return "status-shipped";
      }

      if (normalized === "Delivered") {
        return "status-delivered";
      }

      return "";
    }

    /* =====================================================
       DEMO TRACKING STORAGE
    ===================================================== */

    function demoStorageKey(orderId) {
      return DEMO_KEY_PREFIX + orderId;
    }

    function getDemoState(orderId) {
      try {
        const raw = localStorage.getItem(
          demoStorageKey(orderId)
        );

        if (!raw) {
          return null;
        }

        return JSON.parse(raw);
      } catch (error) {
        return null;
      }
    }

    function saveDemoState(orderId, state) {
      try {
        localStorage.setItem(
          demoStorageKey(orderId),
          JSON.stringify(state)
        );
      } catch (error) {
        console.error("Could not save demo tracking:", error);
      }
    }

    /* =====================================================
       CALCULATE TRACKING STAGE
    ===================================================== */

    function calculateStage(elapsed) {

      if (elapsed >= 120000) {
        return {
          stage: "delivered",
          status: "Delivered",
          step: 5
        };
      }

      if (elapsed >= 90000) {
        return {
          stage: "out_for_delivery",
          status: "Shipped",
          step: 4
        };
      }

      if (elapsed >= 60000) {
        return {
          stage: "shipped",
          status: "Shipped",
          step: 3
        };
      }

      if (elapsed >= 30000) {
        return {
          stage: "confirmed",
          status: "Confirmed",
          step: 1
        };
      }

      return {
        stage: "placed",
        status: "Pending",
        step: 0
      };
    }

    /* =====================================================
       AUTOMATIC TRACKING
    ===================================================== */

    function startDemoTracking(order) {

      if (!order || !order.orderId) {
        return;
      }

      stopDemoTracking();

      let state = getDemoState(order.orderId);

      if (!state) {

        state = {
          startedAt: Date.now(),
          completed: false
        };

        saveDemoState(
          order.orderId,
          state
        );
      }

      runDemoTracking(order);
    }

    function runDemoTracking(order) {

      if (!order || !order.orderId) {
        return;
      }

      stopDemoTracking();

      const tick = () => {

        const state =
          getDemoState(order.orderId);

        if (!state || !state.startedAt) {
          return;
        }

        const elapsed =
          Date.now() - Number(state.startedAt);

        const stage =
          calculateStage(elapsed);

        /*
         * Update order in storage.
         */
        const index =
          orders.findIndex(
            item =>
              String(item.orderId) ===
              String(order.orderId)
          );

        if (index === -1) {
          stopDemoTracking();
          return;
        }

        orders[index].status =
          stage.status;

        orders[index].updatedAt =
          new Date().toISOString();

        orders[index].tracking =
          orders[index].tracking || {};

        orders[index].tracking.mode =
          "demo";

        orders[index].tracking.currentStep =
          stage.step;

        orders[index].tracking.currentStage =
          stage.stage;

        orders[index].tracking.completed =
          stage.stage === "delivered";

        saveOrders();

        /*
         * IMPORTANT:
         * Delivered orders are automatically removed
         * from the customer-facing order list.
         */
        if (stage.stage === "delivered") {

          removeDeliveredOrder(
            order.orderId
          );

          stopDemoTracking();

          showToast(
            "Order delivered."
          );

          return;
        }

        /*
         * Refresh the visible details.
         */
        selectedOrderId =
          order.orderId;

        renderOrders();
        renderSelectedOrder();

      };

      tick();

      demoTimer =
        setInterval(
          tick,
          1000
        );
    }

    function stopDemoTracking() {

      if (demoTimer) {
        clearInterval(demoTimer);
        demoTimer = null;
      }
    }

    /* =====================================================
       REMOVE DELIVERED ORDER
    ===================================================== */

    function removeDeliveredOrder(orderId) {

      if (!orderId) {
        return;
      }

      const cleanId =
        String(orderId);

      /*
       * Remove the delivered order from the
       * visible order database.
       */
      orders =
        orders.filter(
          order =>
            String(order.orderId) !==
            cleanId
        );

      saveOrders();

      /*
       * Remove selection.
       */
      if (
        String(selectedOrderId) ===
        cleanId
      ) {
        selectedOrderId = null;

        try {
          localStorage.removeItem(
            SELECTED_ORDER_KEY
          );
        } catch (error) {
          console.error(error);
        }
      }

      /*
       * Remove demo tracking data too.
       */
      try {
        localStorage.removeItem(
          demoStorageKey(cleanId)
        );
      } catch (error) {
        console.error(error);
      }

      renderOrders();
      renderSelectedOrder();
    }

    /* =====================================================
       CLEAN UP ALREADY DELIVERED ORDERS
    ===================================================== */

    function removeAlreadyDeliveredOrders() {

      const deliveredIds =
        orders
          .filter(
            order =>
              normalizeStatus(
                order.status
              ) === "Delivered"
          )
          .map(
            order =>
              String(order.orderId)
          );

      if (!deliveredIds.length) {
        return;
      }

      orders =
        orders.filter(
          order =>
            normalizeStatus(
              order.status
            ) !== "Delivered"
        );

      saveOrders();

      if (
        selectedOrderId &&
        deliveredIds.includes(
          String(selectedOrderId)
        )
      ) {
        selectedOrderId = null;

        try {
          localStorage.removeItem(
            SELECTED_ORDER_KEY
          );
        } catch (error) {}
      }

      deliveredIds.forEach(id => {

        try {
          localStorage.removeItem(
            demoStorageKey(id)
          );
        } catch (error) {}

      });
    }

    /* =====================================================
       RENDER ORDER LIST
    ===================================================== */

    function renderOrders() {

      const container =
        document.getElementById(
          "orderList"
        );

      if (!container) {
        return;
      }

      const filtered =
        orders.filter(order => {

          if (!searchText) {
            return true;
          }

          return String(
            order.orderId || ""
          )
            .toLowerCase()
            .includes(
              searchText.toLowerCase()
            );
        });

      if (!filtered.length) {

        container.innerHTML = `
          <div style="
            text-align:center;
            padding:40px 15px;
            color:#667085;
          ">
            <div style="
              font-size:40px;
              margin-bottom:10px;
            ">📦</div>

            <strong>
              No active orders
            </strong>

            <div style="
              margin-top:7px;
              font-size:13px;
            ">
              Delivered orders are automatically
              removed from this list.
            </div>
          </div>
        `;

        return;
      }

      container.innerHTML =
        filtered.map(order => {

          const active =
            String(order.orderId) ===
            String(selectedOrderId);

          const status =
            normalizeStatus(
              order.status
            );

          const total =
            order.total ??
            order.subtotal ??
            0;

          return `
            <button
              class="order-item ${active ? "active" : ""}"
              onclick="selectOrder('${escapeHTML(order.orderId)}')"
            >

              <div class="order-id">
                ${escapeHTML(order.orderId)}
              </div>

              <div class="order-meta">
                ${formatDate(order.createdAt)}
              </div>

              <div class="order-meta">
                ${formatKES(total)}
              </div>

              <span class="status ${statusClass(status)}">
                ${escapeHTML(status)}
              </span>

            </button>
          `;

        }).join("");
    }

    /* =====================================================
       SELECT ORDER
    ===================================================== */

    function selectOrder(orderId) {

      if (!orderId) {
        return;
      }

      const order =
        orders.find(
          item =>
            String(item.orderId) ===
            String(orderId)
        );

      if (!order) {
        return;
      }

      selectedOrderId =
        order.orderId;

      try {
        localStorage.setItem(
          SELECTED_ORDER_KEY,
          order.orderId
        );
      } catch (error) {}

      renderOrders();
      renderSelectedOrder();

      startDemoTracking(order);
    }

    /* =====================================================
       RENDER DETAILS
    ===================================================== */

    function renderSelectedOrder() {

      const container =
        document.getElementById(
          "details"
        );

      if (!container) {
        return;
      }

      if (!selectedOrderId) {

        container.innerHTML = `
          <div class="empty">

            <div>

              <div class="empty-icon">
                📦
              </div>

              <h2>
                Select an order
              </h2>

              <p style="
                margin-top:8px;
              ">
                Choose an order from the list
                to view its tracking details.
              </p>

            </div>

          </div>
        `;

        return;
      }

      const order =
        orders.find(
          item =>
            String(item.orderId) ===
            String(selectedOrderId)
        );

      if (!order) {

        container.innerHTML = `
          <div class="empty">

            <div>

              <div class="empty-icon">
                🛍️
              </div>

              <h2>
                No active order
              </h2>

              <p style="
                margin-top:8px;
              ">
                Your delivered orders have been
                removed from the active list.
              </p>

            </div>

          </div>
        `;

        return;
      }

      const status =
        normalizeStatus(
          order.status
        );

      const tracking =
        order.tracking || {};

      const currentStep =
        Number(
          tracking.currentStep ?? 0
        );

      const progress =
        Math.min(
          100,
          Math.max(
            0,
            (currentStep / 5) * 100
          )
        );

      const location =
        getTrackingLocation(
          status,
          currentStep
        );

      const estimated =
        getEstimatedDelivery(
          order
        );

      const items =
        Array.isArray(order.items)
          ? order.items
          : [];

      container.innerHTML = `

        <div class="details-header">

          <div>

            <h2>
              Order ${escapeHTML(order.orderId)}
            </h2>

            <p>
              Placed ${formatDate(order.createdAt)}
            </p>

          </div>

          <span class="demo-label">
            DEMO TRACKING
          </span>

        </div>


        <div class="tracking-card">

          <div class="tracking-top">

            <div>

              <div class="tracking-title">
                ${escapeHTML(status)}
              </div>

              <div class="tracking-location">
                ${escapeHTML(location)}
              </div>

            </div>

            <strong>
              ${Math.round(progress)}%
            </strong>

          </div>


          <div class="progress">

            <div
              class="progress-fill"
              style="width:${progress}%"
            ></div>

            <div class="progress-points">

              ${TRACKING_STEPS.map(
                (step, index) => `
                  <div
                    class="point ${
                      index <= currentStep
                        ? "active"
                        : ""
                    }"
                  ></div>
                `
              ).join("")}

            </div>

          </div>


          <div class="timeline">

            ${TRACKING_STEPS.map(
              (step, index) => {

                const active =
                  index <= currentStep;

                return `
                  <div
                    class="timeline-item ${
                      active ? "active" : ""
                    }"
                  >

                    <div class="timeline-dot"></div>

                    <div>

                      <div class="timeline-label">
                        ${escapeHTML(step.label)}
                      </div>

                      <div class="timeline-description">
                        ${escapeHTML(step.description)}
                      </div>

                    </div>

                  </div>
                `;
              }
            ).join("")}

          </div>

        </div>


        <div class="delivery-box">

          <strong>
            Estimated delivery
          </strong>

          <span>
            ${escapeHTML(estimated)}
          </span>

        </div>


        <div class="section-title">
          Order Items
        </div>


        <div>

          ${
            items.length
              ? items.map(item => {

                  const quantity =
                    Number(
                      item.quantity || 1
                    );

                  const price =
                    Number(
                      item.price || 0
                    );

                  return `
                    <div class="product-row">

                      <div class="product-info">

                        <strong>
                          ${escapeHTML(
                            item.name ||
                            "Product"
                          )}
                        </strong>

                        <span>
                          Quantity: ${quantity}
                        </span>

                      </div>

                      <div class="product-price">
                        ${formatKES(
                          price * quantity
                        )}
                      </div>

                    </div>
                  `;

                }).join("")
              : `
                <div style="
                  color:#667085;
                  padding:10px 0;
                ">
                  No item details available.
                </div>
              `
          }

        </div>


        <div class="total">

          <span>
            Total
          </span>

          <span>
            ${formatKES(
              order.total ??
              order.subtotal ??
              0
            )}
          </span>

        </div>


        <div class="actions">

          <button
            class="btn btn-secondary"
            onclick="goBackToStore()"
          >
            Continue Shopping
          </button>

          <button
            class="btn btn-primary"
            onclick="contactSupport()"
          >
            Contact Support
          </button>

        </div>

      `;
    }

    /* =====================================================
       TRACKING LOCATION
    ===================================================== */

    function getTrackingLocation(
      status,
      step
    ) {

      if (step >= 5 || status === "Delivered") {
        return "Delivered";
      }

      if (step >= 4) {
        return "Out for delivery";
      }

      if (status === "Shipped") {
        return "In transit";
      }

      if (status === "Confirmed") {
        return "Seller processing";
      }

      return "Order received";
    }

    /* =====================================================
       ESTIMATED DELIVERY
    ===================================================== */

    function getEstimatedDelivery(order) {

      if (
        normalizeStatus(
          order.status
        ) === "Delivered"
      ) {
        return "Delivered";
      }

      if (!order.createdAt) {
        return "Being prepared";
      }

      const date =
        new Date(
          order.createdAt
        );

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "Being prepared";
      }

      date.setDate(
        date.getDate() + 3
      );

      return date.toLocaleDateString(
        "en-KE",
        {
          dateStyle: "medium"
        }
      );
    }

    /* =====================================================
       START SELECTED ORDER
    ===================================================== */

    function startSelectedOrderTracking() {

      if (!selectedOrderId) {
        return;
      }

      const order =
        orders.find(
          item =>
            String(item.orderId) ===
            String(selectedOrderId)
        );

      if (!order) {
        return;
      }

      if (
        normalizeStatus(
          order.status
        ) === "Delivered"
      ) {
        removeDeliveredOrder(
          order.orderId
        );

        return;
      }

      startDemoTracking(order);
    }

    /* =====================================================
       NAVIGATION
    ===================================================== */

    function goBackToStore() {

      window.location.href =
        "index.html#market";
    }

    function contactSupport() {
      showToast(
        "Support is available in the SM1THX demo."
      );
    }

    /* =====================================================
       SEARCH
    ===================================================== */

    function setupSearch() {

      const search =
        document.getElementById(
          "orderSearch"
        );

      if (!search) {
        return;
      }

      search.addEventListener(
        "input",
        event => {

          searchText =
            event.target.value
              .trim();

          renderOrders();
        }
      );
    }

    /* =====================================================
       INITIALIZE
    ===================================================== */

    function initialize() {

      stopDemoTracking();

      orders =
        getOrders();

      /*
       * Remove any delivered orders that may
       * already exist from an earlier version.
       */
      removeAlreadyDeliveredOrders();

      selectedOrderId =
        getSelectedOrderId();

      /*
       * If selected order no longer exists,
       * automatically select the newest active order.
       */
      const selectedExists =
        orders.some(
          order =>
            String(order.orderId) ===
            String(selectedOrderId)
        );

      if (
        !selectedExists &&
        orders.length
      ) {
        selectedOrderId =
          orders[0].orderId;

        try {
          localStorage.setItem(
            SELECTED_ORDER_KEY,
            selectedOrderId
          );
        } catch (error) {}
      }

      setupSearch();

      renderOrders();
      renderSelectedOrder();

      startSelectedOrderTracking();
    }

    /* =====================================================
       PAGE EVENTS
    ===================================================== */

    window.addEventListener(
      "beforeunload",
      () => {
        stopDemoTracking();
      }
    );

    window.addEventListener(
      "storage",
      event => {

        if (
          event.key === ORDERS_KEY
        ) {
          orders =
            getOrders();

          removeAlreadyDeliveredOrders();

          renderOrders();
          renderSelectedOrder();
        }

      }
    );

    document.addEventListener(
      "DOMContentLoaded",
      initialize
    );

    /* =====================================================
       GLOBAL FUNCTIONS
    ===================================================== */

    window.selectOrder =
      selectOrder;

    window.goBackToStore =
      goBackToStore;

    window.contactSupport =
      contactSupport;

  </script>

</body>
</html>
