<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage SMITHX seller products, images, prices, stock and marketplace publication.">
  <title>My Products — SMITHX</title>
  <link rel="stylesheet" href="styles.css?v=20261014-4">
  <link rel="stylesheet" href="demo-pages.css">
  <link rel="stylesheet" href="seller-workspace.css?v=3">
</head>
<body>
<script>
"use strict";
(function () {
  const user = typeof smxCurrentUser === "function" ? smxCurrentUser() : null;
  const store = user && typeof smxStoreForOwner === "function" ? smxStoreForOwner(user.email) : null;
  const form = document.getElementById("productForm");
  if (!form || !store) return;
  form.addEventListener("submit", function (event) {
    setTimeout(function () {
      const editingId = document.getElementById("editingId");
      const published = document.getElementById("productPublished");
      if (!editingId || !published) return;
      if (!editingId.value && published.checked) {
        window.location.href = "store.html?s=" + encodeURIComponent(store.slug);
      }
    }, 900);
  });
})();
</script>
</body>
</html>
